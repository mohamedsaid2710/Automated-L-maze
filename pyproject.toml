[project]
name = "lmaze"
version = "0.1.0"
description = "Pseudoword distractors for L-maze experiments, for any language and script"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohammed Said"}]
requires-python = ">=3.10"
dependencies = [
    "wordfreq>=3.0",
    "regex>=2023.0",
    "torch>=2.2",
    "numpy",
]

[project.optional-dependencies]
wuggy = ["wuggy>=1.1.2"]

[project.scripts]
lmaze = "lmaze.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

# PyTorch from the CPU-only index on Linux and Windows (the default Linux wheel bundles CUDA, several GB);
# macOS wheels on PyPI are CPU builds already
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmaze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
