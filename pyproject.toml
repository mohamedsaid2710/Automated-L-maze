[project]
name = "lmaze"
version = "0.1.0"
description = "Pseudoword distractors for L-maze experiments, for any language and script"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mohammed Said"}]
requires-python = ">=3.10"
dependencies = [
    "wordfreq>=3.0",
    "regex>=2023.0",
]

[project.optional-dependencies]
wuggy = ["wuggy>=1.1.2"]

[project.scripts]
lmaze = "lmaze.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmaze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
