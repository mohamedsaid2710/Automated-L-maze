name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      # trained letter models are kept between runs (the German test model trains in about a minute)
      - uses: actions/cache@v4
        with:
          path: .lmaze-cache
          key: lmaze-${{ matrix.os }}-${{ hashFiles('src/lmaze/neural.py', 'src/lmaze/lexicon.py', 'uv.lock') }}
      - run: uv run pytest -q
        env:
          LMAZE_CACHE: .lmaze-cache
